name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 要挂载 APK 的已有 tag（例如 v1.2.0）
        required: true
        type: string
        default: v1.2.0

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      RELEASE_STORE_FILE: ${{ github.workspace }}/release-key.jks
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Build APK
        id: build
        run: |
          mkdir -p dist
          TAG="${RELEASE_TAG}"
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "dist/family-recipe-${TAG}.apk"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "apk_name=family-recipe-${TAG}.apk" >> "$GITHUB_OUTPUT"
            echo "notes=此包已使用 Release 密钥签名，可直接覆盖安装升级。" >> "$GITHUB_OUTPUT"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "dist/family-recipe-${TAG}-debug.apk"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "apk_name=family-recipe-${TAG}-debug.apk" >> "$GITHUB_OUTPUT"
            echo "notes=当前为 debug 签名包（未配置 Release 密钥）。GitHub Actions 每次签名可能不同，升级前可能需要先卸载旧版。" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/${{ steps.build.outputs.apk_name }}
          body: |
            ## 家庭菜谱 ${{ env.RELEASE_TAG }}

            请从下方 **Assets** 下载 APK。安装时如系统提示未知来源，请允许当前浏览器或文件管理器安装应用。

            ${{ steps.build.outputs.notes }}

      - name: Write job summary
        run: |
          {
            echo "### 家庭菜谱 ${{ env.RELEASE_TAG }}"
            echo
            echo "- 下载页: https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}"
            echo "- 安装包: \`${{ steps.build.outputs.apk_name }}\`"
            echo "- 签名: ${{ steps.build.outputs.signed == 'true' && 'release' || 'debug' }}"
          } >> "$GITHUB_STEP_SUMMARY"
